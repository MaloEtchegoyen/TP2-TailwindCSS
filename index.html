<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body
    class="bg-image bg-no-repeat bg-cover min-h-screen lg:bg-contain lg:bg-background lg:max-h-screen lg:bg-right"
  >
    <section
      class="min-h-screen h-full flex flex-col justify-center items-center bg-background/80 md:items-start md:gap-50"
    >
      <img class="m-10" src="src/assets/desktop/logo (3).svg" alt="" />
      <div
        class="w-full flex flex-col justify-center items-center gap-10 text-center p-10 md:bg-background md:w-2xl md:text-start md:justify-start md:items-start md:pb-0 lg:flex-row lg:justify-between lg:items-end lg:w-full lg:gap-50 lg:bg-transparent lg:p-0"
      >
        <div
          class="w-full max-w-200 flex flex-col justify-center items-center gap-10 p-10 text-centermd:bg-background md:text-start md:justify-start md:items-start lg:bg-background"
        >
          <h1 class="text-accent text-5xl font-bold uppercase">
            publish your podcasts <span class="text-neutral">everywhere.</span>
          </h1>
          <p class="text-neutral">
            Upload your audio to Pod with a single click. We'll then distribute
            your podcast to Spotify, Apple Podcasts, Google Podcasts, Pocket
            Casts and more!
          </p>
          <ul class="flex gap-4">
            <li class="">
              <img src="src/assets/desktop/spotify (3).svg" alt="spotify" />
            </li>
            <li class="">
              <img
                src="src/assets/desktop/apple-podcast.svg"
                alt="apple podcasts"
              />
            </li>
            <li class="">
              <img
                src="src/assets/desktop/google-podcasts (3).svg"
                alt="google podcasts"
              />
            </li>
            <li class="">
              <img
                src="src/assets/desktop/pocket-casts (3).svg"
                alt="pocket casts"
              />
            </li>
          </ul>
          <form
            class="flex flex-col gap-5 w-full md:bg-neutral/20 md:rounded-full md:flex-row md:w-full md:p-1"
            action=""
          >
            <label class="sr-only" for="email">Email Address</label>
            <input
              class="bg-neutral/20 p-3 w-full rounded-full text-neutral/80 md:bg-transparent md:w-2/3"
              type="email"
              placeholder="Email adress"
              id="email"
              name="email"
            />
            <button
              class="bg-accent 20 p-3 w-full rounded-full text-background font-bold md:w-1/3"
              type="submit"
            >
              Request Access
            </button>
          </form>
        </div>
        <section class=" after:bg-pattern after:bg-no-repeat after:md:block after:w-50 after:aspect-video"></section>
      </div>
    </section>
  </body>
</html>
